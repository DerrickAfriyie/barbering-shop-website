<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Now - DAJ Cuts</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="barb.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav id="navbar">
        <div class="logo">DAJ cuts</div>
        <a href="barb.html" class="back-button">
            <i class="fas fa-arrow-left" aria-hidden="true"></i>
            <span>Back to Home</span>
        </a>
    </nav>

    <section id="booking" class="booking">
        <div class="booking-container">
            <h2>Book an Appointment</h2>
            <p class="booking-subtitle">Schedule your next haircut or grooming service with our expert barbers</p>

            <form id="bookingForm" class="booking-form">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email address" required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required>
                </div>

                <div class="form-group service-selection">
                    <label for="service">Select Service</label>
                    <select id="service" name="service" required>
                        <option value="" disabled selected>Choose a service</option>
                        <option value="Classic Haircut">Classic Haircut - 500 cedis</option>
                        <option value="Beard Trim">Beard Trim - 100 cedis</option>
                        <option value="Hot Towel Shave">Hot Towel Shave - 650 cedis</option>
                        <option value="Kid Cut">Kid Cut - 160 cedis</option>
                        <option value="Full Package">Full Package (Haircut + Beard + Shave) - 1000 cedis</option>
                    </select>
                    <div class="select-icon">
                        <i class="fas fa-cut" aria-hidden="true"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label for="date">Appointment Date</label>
                    <input type="date" id="date" name="date" required>
                </div>

                <div class="form-group">
                    <label for="time">Appointment Time</label>
                    <input type="time" id="time" name="time" required>
                </div>

                <div class="form-group">
                    <label for="notes">Special Requests (Optional)</label>
                    <textarea id="notes" name="notes" placeholder="Any special requests or notes for your appointment"></textarea>
                </div>

                <button type="submit">Confirm Booking</button>
            </form>
        </div>
    </section>

    <footer>
        <div class="copyright">
            <p>&copy; 2025 DAJ's Cuts Barbershop. All rights reserved.</p>
        </div>
    </footer>

    <script src="barb.js"></script>
</body>
</html>
